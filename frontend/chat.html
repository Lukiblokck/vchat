<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vchat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0a0a0f;
    --surface:  #13131a;
    --surface2: #1a1a24;
    --border:   #22222e;
    --accent:   #7c6dfa;
    --accent2:  #fa6d9b;
    --text:     #e8e8f0;
    --muted:    #5a5a70;
    --muted2:   #3a3a50;
    --online:   #4ade80;
    --radius:   12px;
    --sidebar:  260px;
  }

  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }

  .app {
    display: grid;
    grid-template-columns: var(--sidebar) 1fr;
    height: 100vh;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sidebar-header {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .logo {
    font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -1px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 4px;
  }
  .room-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted);
    letter-spacing: .04em; transition: opacity .3s;
  }
  .room-badge::before {
    content: ''; display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: var(--online); box-shadow: 0 0 6px var(--online);
  }

  .section-title {
    padding: 16px 20px 6px;
    font-family: 'DM Mono', monospace; font-size: 10px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--muted); flex-shrink: 0;
  }

  /* ── ROOMS LIST ── */
  .rooms-list { padding: 0 10px 4px; flex-shrink: 0; }
  .room-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 8px; cursor: pointer;
    font-size: 13px; font-weight: 500; color: var(--muted);
    transition: background .15s, color .15s;
    user-select: none;
  }
  .room-item:hover { background: var(--surface2); color: var(--text); }
  .room-item.active {
    background: rgba(124,109,250,.15);
    color: var(--accent);
  }
  .room-item .room-hash {
    font-family: 'DM Mono', monospace; font-size: 13px;
    color: var(--muted2); flex-shrink: 0;
  }
  .room-item.active .room-hash { color: rgba(124,109,250,.6); }
  .room-unread {
    margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px;
    background: var(--accent2); border-radius: 99px;
    font-size: 10px; font-weight: 700; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace;
  }

  .sidebar-divider { height: 1px; background: var(--border); margin: 8px 0; flex-shrink: 0; }

  /* ── USERS LIST ── */
  .users-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
  .users-list::-webkit-scrollbar { width: 3px; }
  .users-list::-webkit-scrollbar-thumb { background: var(--muted2); border-radius: 99px; }
  .user-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; border-radius: 8px; transition: background .15s;
  }
  .user-item:hover { background: var(--surface2); }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 11px; flex-shrink: 0;
  }
  .user-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .user-name.is-me::after { content: ' (tú)'; font-size: 11px; color: var(--muted); font-weight: 400; }

  .sidebar-footer { padding: 14px 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .btn-logout {
    width: 100%; padding: 9px 14px; background: transparent;
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted); font-family: 'DM Mono', monospace; font-size: 11px;
    letter-spacing: .06em; cursor: pointer; transition: border-color .2s, color .2s, background .2s;
  }
  .btn-logout:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(250,109,155,.06); }

  /* ── CHAT AREA ── */
  .chat-area { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .topbar {
    padding: 0 28px; height: 62px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    background: rgba(10,10,15,.7); backdrop-filter: blur(10px);
  }
  .room-name { font-family: 'Syne', sans-serif; font-weight: 600; font-size: 16px; letter-spacing: -.3px; }
  .room-name .hash { color: var(--muted); font-weight: 400; margin-right: 2px; }
  .typing-indicator {
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted);
    min-width: 160px; text-align: right; height: 16px; overflow: hidden;
  }
  .typing-indicator .dots { display: inline-flex; gap: 2px; vertical-align: middle; }
  .typing-indicator .dot {
    width: 3px; height: 3px; border-radius: 50%; background: var(--muted);
    animation: dotbounce .9s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes dotbounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-4px)} }

  /* ── MENSAJES ── */
  .messages {
    flex: 1; overflow-y: auto; padding: 24px 28px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-thumb { background: var(--muted2); border-radius: 99px; }

  .date-sep {
    display: flex; align-items: center; gap: 12px; margin: 16px 0 8px;
    font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: .08em;
  }
  .date-sep::before, .date-sep::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .msg-group { margin: 10px 0 2px; }
  .msg-header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; padding-left: 2px; }
  .msg-author { font-family: 'Syne', sans-serif; font-weight: 600; font-size: 13px; }
  .msg-time { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--muted); }

  .msg-bubble {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 4px 12px 12px 12px; padding: 9px 14px;
    font-size: 14px; line-height: 1.55; color: var(--text);
    max-width: 480px; word-break: break-word;
    animation: msgIn .25s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes msgIn { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }

  .msg-group.mine { align-items: flex-end; display: flex; flex-direction: column; }
  .msg-group.mine .msg-header { flex-direction: row-reverse; }
  .msg-group.mine .msg-bubble {
    background: rgba(124,109,250,.18); border-color: rgba(124,109,250,.35);
    border-radius: 12px 4px 12px 12px;
  }

  .msg-bubble.media { padding: 4px; background: transparent; border-color: transparent; }
  .msg-bubble.media img,
  .msg-bubble.media video {
    display: block; max-width: 320px; max-height: 280px;
    border-radius: 10px; border: 1px solid var(--border);
    cursor: pointer; transition: opacity .15s;
  }
  .msg-bubble.media img:hover, .msg-bubble.media video:hover { opacity: .88; }
  .msg-group.mine .msg-bubble.media { background: transparent; border-color: transparent; }

  .upload-progress {
    display: flex; align-items: center; gap: 10px; padding: 9px 14px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 4px 12px 12px 12px; max-width: 280px;
    font-size: 13px; color: var(--muted);
    animation: msgIn .25s cubic-bezier(.22,1,.36,1) both;
  }
  .upload-bar-wrap { flex: 1; height: 3px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .upload-bar { height: 100%; background: var(--accent); border-radius: 99px; transition: width .2s; }

  .sys-msg {
    text-align: center; font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--muted); padding: 10px 0; letter-spacing: .04em;
  }

  /* ── INPUT ── */
  .input-area { padding: 16px 28px 20px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .input-row {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 6px 8px;
    transition: border-color .2s, box-shadow .2s;
  }
  .input-row:focus-within {
    border-color: rgba(124,109,250,.5); box-shadow: 0 0 0 3px rgba(124,109,250,.1);
  }
  .clip-btn {
    width: 34px; height: 34px; border-radius: 8px; border: none;
    background: transparent; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: color .15s, background .15s;
  }
  .clip-btn:hover { color: var(--accent); background: rgba(124,109,250,.1); }
  .clip-btn svg { width: 18px; height: 18px; }
  .msg-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px;
    line-height: 1.5; resize: none; max-height: 120px; min-height: 24px; padding: 6px 0;
  }
  .msg-input::placeholder { color: var(--muted); }
  .send-btn {
    width: 36px; height: 36px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: background .15s, transform .12s, opacity .15s;
  }
  .send-btn:hover { background: #6a5cee; transform: scale(1.05); }
  .send-btn:active { transform: scale(.95); }
  .send-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
  .send-btn svg { width: 16px; height: 16px; }

  /* lightbox */
  .lightbox {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.88); backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    cursor: zoom-out; animation: lbIn .18s ease;
  }
  @keyframes lbIn { from{opacity:0} to{opacity:1} }
  .lightbox img, .lightbox video {
    max-width: 92vw; max-height: 90vh;
    border-radius: 10px; box-shadow: 0 0 80px rgba(0,0,0,.6); cursor: default;
  }
  .lightbox-close {
    position: absolute; top: 20px; right: 24px;
    background: rgba(255,255,255,.12); border: none; color: #fff;
    font-size: 22px; width: 38px; height: 38px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .lightbox-close:hover { background: rgba(255,255,255,.22); }

  /* colores avatar */
  .av0 { background: rgba(124,109,250,.25); color: #a99ff8; }
  .av1 { background: rgba(250,109,155,.2);  color: #f98db4; }
  .av2 { background: rgba(74,222,128,.15);  color: #6ee49a; }
  .av3 { background: rgba(251,191,36,.15);  color: #fcc94a; }
  .av4 { background: rgba(56,189,248,.15);  color: #5ec8f5; }
  .av5 { background: rgba(251,146,60,.15);  color: #fc9a5a; }

  @media (max-width: 640px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { display: none; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">vchat</div>
      <div class="room-badge" id="room-badge">conectado</div>
    </div>

    <div class="section-title">Salas</div>
    <div class="rooms-list" id="rooms-list"></div>

    <div class="sidebar-divider"></div>

    <div class="section-title">Conectados</div>
    <div class="users-list" id="users-list"></div>

    <div class="sidebar-footer">
      <button class="btn-logout" onclick="logout()">// salir</button>
    </div>
  </aside>

  <!-- CHAT -->
  <main class="chat-area">
    <div class="topbar">
      <div class="room-name">
        <span class="hash">#</span><span id="topbar-room">general</span>
      </div>
      <div class="typing-indicator" id="typing-indicator"></div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <div class="input-row">
        <button class="clip-btn" onclick="document.getElementById('file-input').click()" title="Adjuntar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <input type="file" id="file-input" accept="image/*,video/mp4,video/webm,video/quicktime" style="display:none" onchange="handleFile(this)">
        <textarea class="msg-input" id="msg-input" placeholder="Escribe algo..." rows="1" maxlength="1000"></textarea>
        <button class="send-btn" onclick="sendMessage()" title="Enviar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  </main>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" style="display:none" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <div id="lightbox-content" onclick="event.stopPropagation()"></div>
</div>

<script>
// ── estado ──
let ME = null;
let currentRoom = null;
let typingTimer = null;
let isTyping = false;
const avatarCache = {};
let lastAuthor = null;
let lastTime = null;
const unread = {};   // { roomName: count }

// ── sesión ──
(async () => {
  try {
    const res = await fetch('/api/me', { credentials: 'include' });
    const data = await res.json();
    if (!data.ok) { window.location.href = '/'; return; }
    ME = data.username;
  } catch { window.location.href = '/'; return; }
  await loadRooms();
  initSocket();
})();

// ── cargar salas ──
async function loadRooms() {
  const res = await fetch('/api/rooms', { credentials: 'include' });
  const { rooms, default: def } = await res.json();
  currentRoom = def;
  const list = document.getElementById('rooms-list');
  list.innerHTML = '';
  rooms.forEach(r => {
    unread[r] = 0;
    const el = document.createElement('div');
    el.className = 'room-item' + (r === currentRoom ? ' active' : '');
    el.dataset.room = r;
    el.innerHTML = `<span class="room-hash">#</span>${escapeHtml(r)}`;
    el.onclick = () => switchRoom(r);
    list.appendChild(el);
  });
  document.getElementById('topbar-room').textContent = currentRoom;
}

function switchRoom(room) {
  if (room === currentRoom) return;
  currentRoom = room;

  // actualiza sidebar
  document.querySelectorAll('.room-item').forEach(el => {
    el.classList.toggle('active', el.dataset.room === room);
    if (el.dataset.room === room) {
      const badge = el.querySelector('.room-unread');
      if (badge) badge.remove();
      unread[room] = 0;
    }
  });

  // actualiza topbar
  document.getElementById('topbar-room').textContent = room;

  // limpia mensajes y pide historial al servidor
  document.getElementById('messages').innerHTML = '';
  lastAuthor = null; lastTime = null;
  document.getElementById('typing-indicator').innerHTML = '';

  window.socket.emit('switch_room', { room });
}

// ── Socket.IO ──
function initSocket() {
  const socket = window.socket = io({ withCredentials: true });

  socket.on('connect', () => {
    document.getElementById('room-badge').style.opacity = '1';
  });

  socket.on('history', ({ messages, room }) => {
    if (room !== currentRoom) return;
    const box = document.getElementById('messages');
    box.innerHTML = '';
    lastAuthor = null; lastTime = null;
    messages.forEach(m => appendMessage(m, false));
    scrollToBottom();
  });

  socket.on('new_message', (msg) => {
    if (msg.room === currentRoom) {
      appendMessage(msg, true);
      scrollToBottom();
    } else {
      // sala en segundo plano → incrementa contador
      unread[msg.room] = (unread[msg.room] || 0) + 1;
      const el = document.querySelector(`.room-item[data-room="${msg.room}"]`);
      if (el) {
        let badge = el.querySelector('.room-unread');
        if (!badge) { badge = document.createElement('span'); badge.className = 'room-unread'; el.appendChild(badge); }
        badge.textContent = unread[msg.room];
      }
    }
  });

  socket.on('user_joined', ({ username }) => appendSystem(`${escapeHtml(username)} entró`));
  socket.on('user_left',   ({ username }) => appendSystem(`${escapeHtml(username)} salió`));
  socket.on('users_update', ({ users }) => renderUsers(users));

  socket.on('user_typing', ({ username, typing }) => {
    const el = document.getElementById('typing-indicator');
    el.innerHTML = typing
      ? `${escapeHtml(username)} escribe <span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>`
      : '';
  });

  socket.on('upload_error', ({ msg }) => appendSystem(`Error: ${msg}`));

  socket.on('disconnect', () => {
    document.getElementById('room-badge').style.opacity = '.4';
    appendSystem('Desconectado — reconectando...');
  });
}

// ── usuarios ──
const COLORS = ['av0','av1','av2','av3','av4','av5'];
const NAME_COLORS = ['#a99ff8','#f98db4','#6ee49a','#fcc94a','#5ec8f5','#fc9a5a'];

function getColor(name) {
  if (!avatarCache[name]) {
    avatarCache[name] = COLORS[[...name].reduce((a,c) => a + c.charCodeAt(0), 0) % COLORS.length];
  }
  return avatarCache[name];
}
function getAccentColor(name) {
  return NAME_COLORS[[...name].reduce((a,c) => a + c.charCodeAt(0), 0) % NAME_COLORS.length];
}

function renderUsers(users) {
  const list = document.getElementById('users-list');
  list.innerHTML = '';
  users.forEach(name => {
    const item = document.createElement('div');
    item.className = 'user-item';
    item.innerHTML = `
      <div class="avatar ${getColor(name)}">${escapeHtml(name[0].toUpperCase())}</div>
      <span class="user-name${name === ME ? ' is-me' : ''}">${escapeHtml(name)}</span>`;
    list.appendChild(item);
  });
}

// ── mensajes ──
function makeBubble(msg, animate) {
  const bubble = document.createElement('div');
  if (msg.type === 'image') {
    bubble.className = 'msg-bubble media';
    const img = document.createElement('img');
    img.src = msg.text; img.alt = 'imagen'; img.loading = 'lazy';
    img.onclick = () => openLightbox('image', msg.text);
    bubble.appendChild(img);
  } else if (msg.type === 'video') {
    bubble.className = 'msg-bubble media';
    const vid = document.createElement('video');
    vid.src = msg.text; vid.controls = true; vid.preload = 'metadata';
    vid.onclick = () => openLightbox('video', msg.text);
    bubble.appendChild(vid);
  } else {
    bubble.className = 'msg-bubble';
    bubble.innerHTML = escapeHtml(msg.text);
  }
  if (!animate) bubble.style.animation = 'none';
  return bubble;
}

function appendMessage(msg, animate) {
  const box = document.getElementById('messages');
  const isMine = msg.username === ME;
  const timeStr = formatTime(msg.timestamp);
  const dateStr = formatDate(msg.timestamp);

  if (dateStr !== lastTime) {
    const sep = document.createElement('div');
    sep.className = 'date-sep'; sep.textContent = dateStr;
    box.appendChild(sep);
    lastAuthor = null; lastTime = dateStr;
  }

  if (msg.username !== lastAuthor) {
    const group = document.createElement('div');
    group.className = 'msg-group' + (isMine ? ' mine' : '');
    const header = document.createElement('div');
    header.className = 'msg-header';
    header.innerHTML = `
      <div class="avatar ${getColor(msg.username)}" style="width:26px;height:26px;font-size:11px">${escapeHtml(msg.username[0].toUpperCase())}</div>
      <span class="msg-author" style="color:${getAccentColor(msg.username)}">${escapeHtml(msg.username)}</span>
      <span class="msg-time">${timeStr}</span>`;
    group.appendChild(header);
    group.appendChild(makeBubble(msg, animate));
    box.appendChild(group);
    lastAuthor = msg.username;
  } else {
    const groups = box.querySelectorAll('.msg-group');
    const last = groups[groups.length - 1];
    if (last) last.appendChild(makeBubble(msg, animate));
  }
}

function appendSystem(text) {
  const box = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'sys-msg'; el.textContent = `— ${text} —`;
  box.appendChild(el); lastAuthor = null; scrollToBottom();
}

// ── enviar texto ──
function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  window.socket.emit('send_message', { text });
  input.value = ''; input.style.height = 'auto';
  clearTyping();
}

// ── subir archivo ──
function handleFile(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  const mime = file.type;
  if (!mime.startsWith('image/') && !mime.startsWith('video/')) {
    appendSystem('Solo se permiten imágenes y videos');
    return;
  }
  const box = document.getElementById('messages');
  const progressEl = document.createElement('div');
  progressEl.className = 'msg-group mine';
  progressEl.innerHTML = `<div class="upload-progress">
    <span>${escapeHtml(file.name)}</span>
    <div class="upload-bar-wrap"><div class="upload-bar" id="ubar" style="width:0%"></div></div>
  </div>`;
  box.appendChild(progressEl); lastAuthor = null; scrollToBottom();

  const reader = new FileReader();
  reader.onprogress = (e) => {
    if (e.lengthComputable) {
      const bar = document.getElementById('ubar');
      if (bar) bar.style.width = Math.round(e.loaded / e.total * 80) + '%';
    }
  };
  reader.onload = () => {
    const bar = document.getElementById('ubar');
    if (bar) bar.style.width = '100%';
    setTimeout(() => progressEl.remove(), 300);
    window.socket.emit('send_file', { mime, data: reader.result });
  };
  reader.onerror = () => { progressEl.remove(); appendSystem('No se pudo leer el archivo'); };
  reader.readAsDataURL(file);
}

// ── lightbox ──
function openLightbox(type, src) {
  const lb = document.getElementById('lightbox');
  const content = document.getElementById('lightbox-content');
  content.innerHTML = '';
  if (type === 'image') {
    const img = document.createElement('img'); img.src = src; content.appendChild(img);
  } else {
    const vid = document.createElement('video');
    vid.src = src; vid.controls = true; vid.autoplay = true; content.appendChild(vid);
  }
  lb.style.display = 'flex';
  document.addEventListener('keydown', onLightboxKey);
}
function closeLightbox() {
  document.getElementById('lightbox').style.display = 'none';
  document.getElementById('lightbox-content').innerHTML = '';
  document.removeEventListener('keydown', onLightboxKey);
}
function onLightboxKey(e) { if (e.key === 'Escape') closeLightbox(); }

// ── textarea ──
const msgInput = document.getElementById('msg-input');
msgInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  sendTyping(true);
});
msgInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
msgInput.addEventListener('blur', clearTyping);

function sendTyping(on) {
  if (!isTyping && on) { isTyping = true; window.socket?.emit('typing', { typing: true }); }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(clearTyping, 1800);
}
function clearTyping() {
  if (isTyping) { isTyping = false; window.socket?.emit('typing', { typing: false }); }
  clearTimeout(typingTimer);
}

// ── logout ──
async function logout() {
  await fetch('/api/logout', { method: 'POST', credentials: 'include' });
  window.location.href = '/';
}

// ── utils ──
function scrollToBottom() { const b = document.getElementById('messages'); b.scrollTop = b.scrollHeight; }
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}
function formatTime(iso) { return new Date(iso).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }); }
function formatDate(iso) {
  const d = new Date(iso), today = new Date();
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  if (d.toDateString() === today.toDateString()) return 'hoy';
  if (d.toDateString() === yesterday.toDateString()) return 'ayer';
  return d.toLocaleDateString('es', { day: 'numeric', month: 'long' });
}
